name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip -o AI-Stock-Master-Pro-2.0-Android.zip
      - name: Remove conflicting AndroidX dependency
        run: |
          sed -i '/androidx.activity:activity/d' app/build.gradle
          sed -i 's/import androidx.activity.ComponentActivity;/import android.app.Activity;/' app/src/main/java/com/aistockmaster/app/MainActivity.java
          sed -i 's/extends ComponentActivity/extends Activity/' app/src/main/java/com/aistockmaster/app/MainActivity.java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Stock-Master-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
